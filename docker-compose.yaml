services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - "$HOME/data/redis:/data"
    command: redis-server --requirepass 123456
  
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    user: root
    ports:
      - "9010:9000"   # S3 API 对外端口
      - "9011:9001"   # 控制台对外端口
    environment:
      RUSTFS_CONSOLE_ENABLE: true
      # CORS 设置，控制台与 S3 API 都放开来源
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      # 访问密钥（生产环境请修改为强密码）
      RUSTFS_ACCESS_KEY: MarkusPersad
      RUSTFS_SECRET_KEY: "12345678"
      RUSTFS_REGION: cn-north-1
      # 日志级别
      RUSTFS_LOG_LEVEL: info

    volumes:
      # 存储数据卷
      - $HOME/data/rustfs:/data
      # 日志目录
      - $HOME/data/logs/rustfs:/app/logs

  postgres:
    image: kartoza/postgis
    container_name: postgres
    volumes:
      - $HOME/data/postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres,postgis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - ALLOW_IP_RANGE=0.0.0.0/0
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology,postgis_raster,pgroutin
    restart: on-failure
    healthcheck:
      test: "pg_isready -h 127.0.0.1 -U postgres"
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 1m
  kafka:
    image: apache/kafka:latest 
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"  # Controller 端口
    environment:
      # KRaft 核心配置
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      
      # 监听器配置
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.12:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      
      # Topic 初始化（v4 兼容）
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # 建议手动创建，避免配置不可控
      
      # 单节点副本配置
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
      # 其他优化
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - $HOME/data/kafka:/tmp/kraft-combined-logs 
  
  geoserver:
    image: kartoza/geoserver
    container_name: geoserver
    environment:
      - SAMPLE_DATA=true
      - GEOSERVER_DATA_DIR=/opt/geoserver/data_dir
      - FOOTPRINTS_DATA_DIR=/opt/footprints_dir
      - FONTS_DIR=/opt/fonts
      - GEOWEBCACHE_CACHE_DIR=/opt/geoserver/gwc
      - GEOSERVER_ADMIN_PASSWORD=123456
      - GEOSERVER_ADMIN_USER=admin
      - INITIAL_MEMORY=2G
      - MAXIMUM_MEMORY=4G
      - ENCODING='UTF8'
      - LOGIN_STATUS=on
      - REQUEST_TIMEOUT=60
      - PARALLEL_REQUEST=100
      - GETMAP=10
      - REQUEST_EXCEL=4
      - SINGLE_USER=6
      - GWC_REQUEST=16
      - WPS_REQUEST=1000/d;30s
      # PostGIS 连接
      - POSTGRES_JNDI=TRUE               
      - DB_BACKEND=POSTGRES               
      - HOST=postgres                          
      - POSTGRES_PORT=5432                
      - POSTGRES_DB=postgis                   
      - POSTGRES_USER=postgres  
      - POSTGRES_PASS=123456                        
      - POSTGRES_SCHEMA=public           
      # 磁盘配额配置 - 使用JNDI连接
      - DISK_QUOTA_SIZE=5
      - DISK_QUOTA_JNDI=TRUE
      - DISK_QUOTA_JNDI_NAME=jdbc/postgres
    volumes:
    - $HOME/data/geoserver/data_dir:/opt/geoserver/data_dir
    - $HOME/data/geoserver/gwc:/opt/geoserver/gwc
    - $HOME/data/geoserver/settings:/settings
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - "8081:8080"