services:
  postgres:
    image: postgres:latest
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - "$HOME/data/postgres:/var/lib/postgresql"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - "$HOME/data/redis:/data"
    command: redis-server --requirepass 123456
  
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    user: root
    ports:
      - "9010:9000"   # S3 API 对外端口
      - "9011:9001"   # 控制台对外端口
    environment:
      - RUSTFS_CONSOLE_ENABLE=true
      # CORS 设置，控制台与 S3 API 都放开来源
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      # 访问密钥（生产环境请修改为强密码）
      - RUSTFS_ACCESS_KEY=MarkusPersad
      - RUSTFS_SECRET_KEY=12345678
      # 日志级别
      - RUSTFS_LOG_LEVEL=info

    volumes:
      # 存储数据卷
      - $HOME/data/rustfs:/data
      # 日志目录
      - $HOME/data/logs/rustfs:/app/logs