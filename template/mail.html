<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>验证码</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0f172a; margin: 0; padding: 20px;">
    <div style="background-color: #1e293b; border-radius: 20px; padding: 40px; text-align: center; max-width: 600px; margin: 0 auto; border: 1px solid #334155; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.4);">
        <h1 style="color: #60a5fa; font-size: 2.5rem; margin-bottom: 30px; text-align: center; font-weight: bold;">认证码</h1>
        <div style="background-color: #334155; border-radius: 15px; padding: 30px; margin: 20px 0;">
            <p style="color: #e2e8f0; font-size: 1.2rem; text-align: center; line-height: 1.6; max-width: 600px; margin: 0 auto 20px auto;">您好，{{.UserName}}</p>
            <p style="color: #60a5fa; font-size: 2rem; text-align: center; line-height: 1.6; max-width: 600px; margin: 0 auto 20px auto; letter-spacing: 5px; font-weight: bold;">{{.Code}}</p>
            <p style="color: #94a3b8; font-size: 1rem; text-align: center; line-height: 1.6; max-width: 600px; margin: 20px auto 0 auto;">请在5分钟内使用此验证码完成验证</p>
        </div>
        <p style="color: #64748b; font-size: 0.9rem; text-align: center; line-height: 1.6; max-width: 600px; margin: 20px auto 0 auto;">为保障账户安全，请勿将验证码告知他人。</p>
    </div>
</body>
</html>
